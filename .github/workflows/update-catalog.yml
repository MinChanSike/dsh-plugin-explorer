name: Update Plugin Catalog

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch and update catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
        run: bun run scripts/update-catalog.ts

      - name: Create Pull Request with Catalog Updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REPO_GITHUB_TOKEN }}
          commit-message: "chore(catalog): update plugin catalog with latest dsh-plugin repos"
          branch: "bot/catalog-update"
          delete-branch: true
          title: "chore(catalog): sync latest dsh-plugin catalog"
          body: |
            ### Automated Catalog Sync

            This pull request was automatically generated by the **Update Plugin Catalog** workflow.

            - Synced the latest repositories tagged with topic `dsh-plugin`.
            - Updated category classifications and repository statistics in `catalog.json` and `public/catalog.json`.
          labels: |
            automated-pr
            catalog
