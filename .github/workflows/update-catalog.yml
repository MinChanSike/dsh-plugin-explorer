name: Update Plugin Catalog

on:
  schedule:
    # Run once daily at 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch and update catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
        run: bun run scripts/update-catalog.ts

      # Create the PR as your automation/PAT user
      - name: Create Pull Request with Catalog Updates
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REPO_GITHUB_TOKEN }}

          commit-message: "chore(catalog): update plugin catalog with latest dsh-plugin repos"

          branch: "bot/catalog-update"
          delete-branch: true

          title: "chore(catalog): sync latest dsh-plugin catalog"

          body: |
            ### Automated Catalog Sync

            This pull request was automatically generated by the
            **Update Plugin Catalog** workflow.

            - Synced the latest repositories tagged with topic `dsh-plugin`.
            - Updated category classifications and repository statistics
              in `catalog.json` and `public/catalog.json`.

          labels: |
            automated-pr
            catalog

      # Approve as github-actions[bot]
      - name: Approve Pull Request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.cpr.outputs.pull-request-number }}"

          gh pr review "$PR_NUM" \
            --approve \
            --body "Automated catalog sync validated."

      - name: Merge Pull Request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.cpr.outputs.pull-request-number }}"

          gh pr merge "$PR_NUM" \
            --merge \
            --auto \
            --delete-branch
